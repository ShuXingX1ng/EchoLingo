[project]
name = "echolingo-speech"
version = "0.0.1"
description = "EchoLingo Speech Evaluator: training, evaluation, bundles, and worker runtime."
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
  "transformers>=4.44.0",
  "mlflow>=2.16.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "soundfile>=0.12.1",
  "numpy>=1.26.0,<2.0.0",
  "requests>=2.34.2",
  "praatio>=6.2.2",
  "pyarrow>=24.0.0",
  "safetensors>=0.8.0",
  "fastapi>=0.109.0",
  "uvicorn>=0.27.0",
  "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "httpx>=0.24.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "httpx>=0.24.0",
]
# The Worker runs the torch release the evaluator was trained with.
constraint-dependencies = ["torch==2.5.1", "torchaudio==2.5.1"]

# CUDA wheels on the Linux training machine (ADR-0014); PyPI's CPU/MPS wheels
# for the Speech Evaluation Worker on macOS.
[tool.uv.sources]
torch = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu121", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echolingo_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # .pytest_cache can't be written on the DrvFs (/mnt/e) mount
markers = [
  "gpu: requires a CUDA-capable GPU",
  "network: requires network access (e.g. Hugging Face Hub)",
  "mfa: runs the Montreal Forced Aligner from the `aligner` env",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
