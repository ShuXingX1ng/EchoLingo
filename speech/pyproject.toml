[project]
name = "echolingo-speech"
version = "0.0.1"
description = "EchoLingo Speech Evaluator: training, evaluation, bundles, and worker runtime."
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.4.0",
  "torchaudio>=2.4.0",
  "transformers>=4.44.0",
  "mlflow>=2.16.0",
  "pydantic>=2.8.0",
  "pyyaml>=6.0.2",
  "soundfile>=0.12.1",
  "numpy>=1.26.0,<2.0.0",
  "requests>=2.34.2",
  "praatio>=6.2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0.0",
  "ruff>=0.6.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchaudio = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echolingo_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"  # .pytest_cache can't be written on the DrvFs (/mnt/e) mount
markers = [
  "gpu: requires a CUDA-capable GPU",
  "network: requires network access (e.g. Hugging Face Hub)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
