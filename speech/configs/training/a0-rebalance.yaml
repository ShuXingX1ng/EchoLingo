# M2.5 step 3.2 (roadmap SS18.3): A0 with the word loss rebalanced toward
# accuracy. Diagnostics showed the near-unlearnable stress BCE (~1% positive
# labels) supplied ~48% of A0's validation loss, which drives early stopping.
# Everything else is identical to a0.yaml, so this run changes one factor.
# Two runs use this file with --seed 42 and --seed 1337 (--run-name a0r-seed<seed>).

seed: 42
batch_size: 32
learning_rate: 0.001
weight_decay: 0.01
dropout: 0.3
max_epochs: 150
early_stopping_patience: 15
lr_scheduler_patience: 7
lr_scheduler_factor: 0.5

word_accuracy_weight: 0.9
word_stress_weight: 0.1

error_detection_threshold: 0.6
score_band_width: 1.0

mlflow_experiment_name: speech-evaluator-a0
