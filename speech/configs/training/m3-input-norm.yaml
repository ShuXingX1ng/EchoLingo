# M3 input normalization (roadmap SS18.3): the 3.2c candidate
# (m3-aug-mask-audio.yaml) on layer caches extracted from zero-mean,
# unit-variance encoder input, as the pinned wav2vec2-base-960h feature
# extractor does (`do_normalize: true`); the earlier caches fed it the raw
# waveform. Needs `features.cache extract-layers --normalize-input` and
# `features.augment ... --layers-only --normalize-input` for the train-aug and
# validation-noisy copies. Explicit acoustic features are unchanged. Only that
# one factor changes. Two runs use this file with --seed 42 and --seed 1337
# (--run-name a0aman-seed<seed>).

seed: 42
batch_size: 32
learning_rate: 0.001
weight_decay: 0.01
dropout: 0.3
max_epochs: 150
early_stopping_patience: 15
lr_scheduler_patience: 7
lr_scheduler_factor: 0.5

word_accuracy_weight: 0.9
word_stress_weight: 0.1
normalize_acoustic_features: true
use_canonical_phones: true
hidden_state_layers: [4, 6, 8, 10, 12]
normalize_encoder_input: true
rater_mean_targets: true
augmentation_variants: [train-aug-1, train-aug-2, train-aug-3, train-aug-4]
augmentation_prob: 0.5
time_mask_prob: 0.05
time_mask_max_width: 2
channel_mask_ratio: 0.1

error_detection_threshold: 0.6
score_band_width: 1.0

mlflow_experiment_name: speech-evaluator-a0
