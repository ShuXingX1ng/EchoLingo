# M3 step 3.1b A0-Rater (roadmap SS18.3): m3-rater-mean.yaml plus auxiliary
# heads predicting the experts' spread (std) at sentence, word and phone level,
# internal only. If 3.1a did not beat the M2.5 candidate, set
# rater_mean_targets to false so this still changes one factor. Spread
# targets vary 2-10x less than the scores, so at weight 1.0 the term is
# roughly a fifth of the training loss; validation loss (early stopping, LR
# schedule) leaves it out. Two runs: --seed 42 / 1337
# (--run-name a0rms-seed<seed>).

seed: 42
batch_size: 32
learning_rate: 0.001
weight_decay: 0.01
dropout: 0.3
max_epochs: 150
early_stopping_patience: 15
lr_scheduler_patience: 7
lr_scheduler_factor: 0.5

word_accuracy_weight: 0.9
word_stress_weight: 0.1
normalize_acoustic_features: true
use_canonical_phones: true
hidden_state_layers: [4, 6, 8, 10, 12]
rater_mean_targets: true
predict_rater_spread: true
rater_spread_weight: 1.0

error_detection_threshold: 0.6
score_band_width: 1.0

mlflow_experiment_name: speech-evaluator-a0
