# Study Assistant — hand-authored grounding knowledge
# Sections: feature_map, route_allowlist, pte_faq
# This file is NOT RAG — it is curated and injected verbatim into the system prompt.

# ─── (a) Feature map ──────────────────────────────────────────────────────────
feature_map:
  home: >
    The Home page ( / ) shows the Daily Plan — a set of recommended Practice
    Tasks derived from the learner's Task-Type Weaknesses. Logged-in learners
    see weakness-targeted suggestions; guests see a general welcome with quick
    start links.
  practice: >
    The Practice page ( /practice ) lets the learner choose a Task Type and
    start a Task Practice session. Each Task Type card links to its own
    dedicated practice page (e.g. /practice/write-essay). Every practice page
    supports Theme Practice: type a topic/theme in the theme box and the system
    generates a Stimulus about that theme.
  mock: >
    The Mock Exam page ( /mock ) runs a full simulated PTE Academic exam
    following the official task sequence and strict timing. Stimuli are selected
    randomly (no topic conditioning). The learner cannot change topics; the Word
    Lookup and Study Assistant are disabled during a Mock Exam to preserve
    authenticity.
  history: >
    The History page ( /history ) lists all completed Practice Tasks with their
    Feedback summaries, sortable by date and Task Type.
  stats: >
    The Stats page ( /stats ) displays progress charts: score trends over time,
    per-Task-Type breakdown, and Task-Type Weakness signals derived from the
    learner's Feedback history.
  vocabulary: >
    The Vocabulary page ( /vocabulary ) shows the learner's Vocabulary List —
    words they have explicitly saved from the Word Lookup card. Supports view
    and delete; no spaced-repetition review in v1.
  settings: >
    The Settings page ( /settings ) lets the learner change the UI language
    (English / Simplified Chinese), audio playback speed, and other preferences.
  word_lookup: >
    Word Lookup is available on Task Practice pages. Select any word or phrase
    on-screen; a "译" pill appears — tap it to get a translation card. Single
    English words resolve against the offline ECDICT dictionary; phrases and
    misses fall through to the DeepSeek LLM. Tap the star icon in the card to
    save the word to the Vocabulary List.
  study_assistant: >
    The Study Assistant (this chat) is reachable from a global floating button
    on every page except during a Mock Exam. It can answer navigation questions,
    generate a Practice Task on any topic you name, and answer questions about
    the PTE Academic exam format.
  task_types:
    read_aloud: "Read Aloud — read a short passage aloud; scored on fluency, pronunciation, and content coverage."
    repeat_sentence: "Repeat Sentence — listen once and repeat the sentence verbatim."
    answer_short_question: "Answer Short Question — answer a spoken question with a single word or short phrase."
    summarize_written_text: "Summarize Written Text (SWT) — read a passage and write ONE summarising sentence (5–75 words)."
    write_essay: "Write Essay — write a 200–300 word academic essay on the given topic."
    describe_image: "Describe Image — describe a chart, graph, or picture in 40 seconds."
    re_tell_lecture: "Re-tell Lecture — summarise a spoken lecture in 40 seconds."
    fill_in_the_blanks_reading: "Reading Fill in the Blanks — drag words from a box into blanks in a passage."
    re_order_paragraphs: "Re-order Paragraphs — drag scrambled paragraphs into the correct order."
    multiple_choice_reading: "Multiple Choice Reading — choose the best answer from options about a reading passage."
    summarize_spoken_text: "Summarize Spoken Text — after listening, write a 50–70 word summary."
    fill_in_the_blanks_listening: "Listening Fill in the Blanks — listen and type the missing words."
    highlight_correct_summary: "Highlight Correct Summary — choose the paragraph that best matches a spoken text."
    write_from_dictation: "Write from Dictation — listen and type the spoken sentence exactly."
    personal_intro: "Personal Introduction — a non-scored warm-up: introduce yourself in 25 seconds."

