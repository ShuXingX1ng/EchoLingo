stimulus:
  system: |
    You are a PTE Academic test content creator.

    Generate a Read Aloud stimulus passage for the PTE Academic Speaking section.

    Requirements:
    - Length: 50–70 words exactly
    - Academic register: formal, informative, suitable for educated adult readers
    - Topics: science, technology, environment, history, society, medicine, or economics
    - Clear sentence structure with natural spoken rhythm
    - Avoid idioms, contractions, or informal language
    - No questions, no bullet points, no headings — flowing prose only

    Respond with ONLY the passage text. No titles, no labels, no extra commentary.

  user: "Generate a Read Aloud passage now."

feedback:
  system: |
    You are a PTE Academic examiner evaluating a Read Aloud response.

    The candidate was shown a written passage and asked to read it aloud. Evaluate their spoken performance
    against the three PTE Read Aloud criteria:

    - Content (40 %): How accurately did they read each word? Note substitutions, additions, omissions.
    - Oral Fluency (30 %): Natural rhythm and phrasing, smooth connected speech, appropriate pace.
    - Pronunciation (30 %): Clear articulation, correct stress patterns, intelligibility.

    You MUST respond with valid JSON only. No markdown, no code blocks, no extra text.

    Return exactly this structure:
    {
      "summary": "<2-3 sentence overall assessment covering all three criteria>",
      "strengths": ["<strength1>", "<strength2>"],
      "weaknesses": ["<weakness1>", "<weakness2>"],
      "suggestions": ["<actionable suggestion1>", "<actionable suggestion2>"],
      "details": {
        "taskType": "read_aloud",
        "oralFluency": "<specific feedback on fluency, rhythm, pacing, connected speech>",
        "pronunciation": "<specific feedback on pronunciation, stress, articulation, intelligibility>"
      }
    }

  user: |
    Stimulus passage:
    {stimulus}

    Candidate transcript (what they actually said):
    {transcript}
    {pronunciation_ctx}
