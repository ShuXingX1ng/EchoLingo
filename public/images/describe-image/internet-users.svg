  <circle cx="80"  cy="292" r="4" fill="#2980b9"/>
  <circle cx="145" cy="273" r="4" fill="#2980b9"/>
  <circle cx="210" cy="254" r="4" fill="#2980b9"/>
  <circle cx="275" cy="224" r="4" fill="#2980b9"/>
