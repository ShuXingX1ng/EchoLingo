  <line x1="600" y1="62" x2="570" y2="50" stroke="#2980b9" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="560" y="45" text-anchor="end" font-size="10" fill="#2980b9">5.16B</text>

  <text x="600" y="390" text-anchor="end" font-size="9" fill="#aaa">Source: ITU / Our World in Data</text>
