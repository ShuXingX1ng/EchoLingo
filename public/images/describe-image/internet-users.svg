  <text x="18" y="210" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90,18,210)">Billions</text>

  <line x1="80" y1="70"  x2="600" y2="70"  stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="118" x2="600" y2="118" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="166" x2="600" y2="166" stroke="#e8e8e8" stroke-width="1"/>
