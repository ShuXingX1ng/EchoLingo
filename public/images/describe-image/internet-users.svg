  <line x1="80" y1="310" x2="600" y2="310" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="70"  x2="80"  y2="310" stroke="#333" stroke-width="1.5"/>

  <polyline
    points="80,292 145,273 210,254 275,224 340,195 405,156 470,122 535,87 600,62"
