  <circle cx="405" cy="156" r="4" fill="#2980b9"/>
  <circle cx="470" cy="122" r="4" fill="#2980b9"/>
  <circle cx="535" cy="87"  r="4" fill="#2980b9"/>
  <circle cx="600" cy="62"  r="4" fill="#2980b9"/>

