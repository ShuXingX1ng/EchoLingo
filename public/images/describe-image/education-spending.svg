<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>

  <!-- Title -->
  <text x="320" y="28" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Government Expenditure on Education vs GDP Growth</text>
  <text x="320" y="46" text-anchor="middle" font-size="11" fill="#666">Selected countries, 2010 and 2020 comparison</text>

  <!-- Legend -->
  <rect x="200" y="56" width="12" height="12" fill="#3498db" rx="2"/>
  <text x="216" y="67" font-size="10" fill="#555">2010</text>
  <rect x="270" y="56" width="12" height="12" fill="#e67e22" rx="2"/>
  <text x="286" y="67" font-size="10" fill="#555">2020</text>

  <!-- Grid -->
  <line x1="80" y1="80"  x2="600" y2="80"  stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="120" x2="600" y2="120" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="160" x2="600" y2="160" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="200" x2="600" y2="200" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="240" x2="600" y2="240" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="280" x2="600" y2="280" stroke="#e8e8e8" stroke-width="1"/>

  <!-- Y ticks -->
  <text x="72" y="84"  text-anchor="end" font-size="10" fill="#666">7%</text>
  <text x="72" y="124" text-anchor="end" font-size="10" fill="#666">6%</text>
  <text x="72" y="164" text-anchor="end" font-size="10" fill="#666">5%</text>
  <text x="72" y="204" text-anchor="end" font-size="10" fill="#666">4%</text>
  <text x="72" y="244" text-anchor="end" font-size="10" fill="#666">3%</text>
  <text x="72" y="284" text-anchor="end" font-size="10" fill="#666">2%</text>

  <!-- Y axis label -->
  <text x="18" y="190" text-anchor="middle" font-size="10" fill="#555" transform="rotate(-90,18,190)">% of GDP</text>

  <!-- Axes -->
  <line x1="80" y1="280" x2="600" y2="280" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="80"  x2="80"  y2="280" stroke="#333" stroke-width="1.5"/>

  <!--
    Countries: Australia, Canada, Finland, Japan, UK, USA
    2010 %: 5.1, 5.3, 6.8, 3.8, 5.5, 5.4
    2020 %: 5.5, 5.6, 6.5, 3.4, 5.8, 6.1
    y = 280 - ((val - 2)/5)*200
    Australia 2010: 280-(3.1/5*200)=156, 2020: 280-(3.5/5*200)=140
    Canada 2010: 280-(3.3/5*200)=148, 2020: 280-(3.6/5*200)=136
    Finland 2010: 280-(4.8/5*200)=88, 2020: 280-(4.5/5*200)=100
    Japan 2010: 280-(1.8/5*200)=208, 2020: 280-(1.4/5*200)=224
    UK 2010: 280-(3.5/5*200)=140, 2020: 280-(3.8/5*200)=128
    USA 2010: 280-(3.4/5*200)=144, 2020: 280-(4.1/5*200)=116
  -->

  <!-- Grouped bars: bar width=18, gap=4, group gap=16 -->
  <!-- Australia x=104 -->
  <rect x="98"  y="156" width="18" height="124" fill="#3498db"/>
  <rect x="118" y="140" width="18" height="140" fill="#e67e22"/>
  <text x="119" y="295" text-anchor="middle" font-size="9.5" fill="#444">Australia</text>

  <!-- Canada x=178 -->
  <rect x="172" y="148" width="18" height="132" fill="#3498db"/>
  <rect x="192" y="136" width="18" height="144" fill="#e67e22"/>
  <text x="193" y="295" text-anchor="middle" font-size="9.5" fill="#444">Canada</text>

  <!-- Finland x=252 -->
  <rect x="246" y="88"  width="18" height="192" fill="#3498db"/>
  <rect x="266" y="100" width="18" height="180" fill="#e67e22"/>
  <text x="267" y="295" text-anchor="middle" font-size="9.5" fill="#444">Finland</text>

  <!-- Japan x=326 -->
  <rect x="320" y="208" width="18" height="72" fill="#3498db"/>
  <rect x="340" y="224" width="18" height="56" fill="#e67e22"/>
  <text x="341" y="295" text-anchor="middle" font-size="9.5" fill="#444">Japan</text>

  <!-- UK x=400 -->
  <rect x="394" y="140" width="18" height="140" fill="#3498db"/>
  <rect x="414" y="128" width="18" height="152" fill="#e67e22"/>
  <text x="415" y="295" text-anchor="middle" font-size="9.5" fill="#444">UK</text>

  <!-- USA x=474 -->
  <rect x="468" y="144" width="18" height="136" fill="#3498db"/>
  <rect x="488" y="116" width="18" height="164" fill="#e67e22"/>
  <text x="489" y="295" text-anchor="middle" font-size="9.5" fill="#444">USA</text>

  <!-- Source -->
  <text x="600" y="390" text-anchor="end" font-size="9" fill="#aaa">Source: World Bank, 2022</text>
</svg>
