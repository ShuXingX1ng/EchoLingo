<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">Renewable Energy Share by Country (2022)</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#666">Percentage of total electricity generation</text>

  <text x="18" y="210" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90,18,210)">Share (%)</text>

  <line x1="80" y1="70" x2="600" y2="70" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="110" x2="600" y2="110" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="150" x2="600" y2="150" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="190" x2="600" y2="190" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="230" x2="600" y2="230" stroke="#e8e8e8" stroke-width="1"/>
  <line x1="80" y1="270" x2="600" y2="270" stroke="#e8e8e8" stroke-width="1"/>

  <text x="72" y="74"  text-anchor="end" font-size="10" fill="#666">100</text>
  <text x="72" y="114" text-anchor="end" font-size="10" fill="#666">80</text>
  <text x="72" y="154" text-anchor="end" font-size="10" fill="#666">60</text>
  <text x="72" y="194" text-anchor="end" font-size="10" fill="#666">40</text>
  <text x="72" y="234" text-anchor="end" font-size="10" fill="#666">20</text>
  <text x="72" y="274" text-anchor="end" font-size="10" fill="#666">0</text>

  <line x1="80" y1="270" x2="600" y2="270" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="70"  x2="80"  y2="270" stroke="#333" stroke-width="1.5"/>

  <rect x="96"  y="71"  width="52" height="199" fill="#2ecc71"/>
  <text x="122" y="66"  text-anchor="middle" font-size="10" fill="#222">98%</text>
  <text x="122" y="285" text-anchor="middle" font-size="10" fill="#444">Norway</text>

  <rect x="166" y="70"  width="52" height="200" fill="#2ecc71"/>
  <text x="192" y="65"  text-anchor="middle" font-size="10" fill="#222">100%</text>
  <text x="192" y="285" text-anchor="middle" font-size="10" fill="#444">Iceland</text>

  <rect x="236" y="102" width="52" height="168" fill="#27ae60"/>
  <text x="262" y="97"  text-anchor="middle" font-size="10" fill="#222">84%</text>
  <text x="262" y="285" text-anchor="middle" font-size="10" fill="#444">Brazil</text>

  <rect x="306" y="182" width="52" height="88" fill="#f39c12"/>
  <text x="332" y="177" text-anchor="middle" font-size="10" fill="#222">44%</text>
  <text x="332" y="285" text-anchor="middle" font-size="10" fill="#444">Germany</text>

  <rect x="376" y="212" width="52" height="58" fill="#e74c3c"/>
  <text x="402" y="207" text-anchor="middle" font-size="10" fill="#222">29%</text>
  <text x="402" y="285" text-anchor="middle" font-size="10" fill="#444">China</text>

  <rect x="446" y="228" width="52" height="42" fill="#e74c3c"/>
  <text x="472" y="223" text-anchor="middle" font-size="10" fill="#222">21%</text>
  <text x="472" y="285" text-anchor="middle" font-size="10" fill="#444">USA</text>

  <rect x="516" y="234" width="52" height="36" fill="#c0392b"/>
  <text x="542" y="229" text-anchor="middle" font-size="10" fill="#222">18%</text>
  <text x="542" y="285" text-anchor="middle" font-size="10" fill="#444">India</text>

  <rect x="100" y="340" width="14" height="12" fill="#2ecc71"/>
  <text x="118" y="351" font-size="10" fill="#555">80%+ (High)</text>
  <rect x="230" y="340" width="14" height="12" fill="#f39c12"/>
  <text x="248" y="351" font-size="10" fill="#555">40-79% (Medium)</text>
  <rect x="380" y="340" width="14" height="12" fill="#e74c3c"/>
  <text x="398" y="351" font-size="10" fill="#555">Under 40% (Low)</text>

  <text x="600" y="390" text-anchor="end" font-size="9" fill="#aaa">Source: IEA, 2022</text>
</svg>
