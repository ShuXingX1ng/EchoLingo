<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="Arial, sans-serif">
  <rect width="640" height="400" fill="#ffffff"/>

  <text x="320" y="30" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a2e">CO2 Emissions by Transport Mode (2019)</text>
  <text x="320" y="48" text-anchor="middle" font-size="11" fill="#666">Share of total transport sector emissions (%)</text>

  <!-- Pie slices pre-computed path arcs, centre (260,210) radius 140 -->
  <!-- Road 72%: 0 to 259.2 degrees -->
  <path d="M260,210 L260,70 A140,140 0 1,1 35.1,307.8 Z" fill="#e74c3c"/>
  <!-- Aviation 11.6%: 259.2 to 300.96 degrees -->
  <path d="M260,210 L35.1,307.8 A140,140 0 0,1 118.4,67.0 Z" fill="#3498db"/>
  <!-- Shipping 10.5%: 300.96 to 338.76 degrees -->
  <path d="M260,210 L118.4,67.0 A140,140 0 0,1 190.6,72.0 Z" fill="#2ecc71"/>
  <!-- Rail 1%: 338.76 to 342.36 degrees -->
  <path d="M260,210 L190.6,72.0 A140,140 0 0,1 196.9,70.4 Z" fill="#f39c12"/>
  <!-- Other 4.9%: 342.36 to 360 degrees -->
  <path d="M260,210 L196.9,70.4 A140,140 0 0,1 260,70 Z" fill="#9b59b6"/>

  <!-- White centre -->
  <circle cx="260" cy="210" r="60" fill="#ffffff"/>
  <text x="260" y="205" text-anchor="middle" font-size="11" fill="#555">Transport</text>
  <text x="260" y="220" text-anchor="middle" font-size="11" fill="#555">Emissions</text>

  <rect x="430" y="110" width="14" height="14" fill="#e74c3c" rx="2"/>
  <text x="450" y="122" font-size="11" fill="#333">Road vehicles - 72.0%</text>

  <rect x="430" y="140" width="14" height="14" fill="#3498db" rx="2"/>
  <text x="450" y="152" font-size="11" fill="#333">Aviation - 11.6%</text>

  <rect x="430" y="170" width="14" height="14" fill="#2ecc71" rx="2"/>
  <text x="450" y="182" font-size="11" fill="#333">Shipping - 10.5%</text>

  <rect x="430" y="200" width="14" height="14" fill="#f39c12" rx="2"/>
  <text x="450" y="212" font-size="11" fill="#333">Rail - 1.0%</text>

  <rect x="430" y="230" width="14" height="14" fill="#9b59b6" rx="2"/>
  <text x="450" y="242" font-size="11" fill="#333">Other - 4.9%</text>

  <text x="600" y="390" text-anchor="end" font-size="9" fill="#aaa">Source: IEA, 2019</text>
</svg>
